version: 2

models:

#---------------------------------------------------
# fct_orders
#---------------------------------------------------

    - name: fct_orders
      description: "Table which has orders rows with related payment information"
      columns:

          - name: order_id
            description: "The customer identifier, primary key of the table"
            data_tests:
                - unique
                - not_null
            
          - name: customer_id
            description: "Foreign key of customer"
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('stg_jaffle_shop__customers')
                    field: id

          - name: order_date
            description: "Date of the order"
            data_tests:
              - not_null

          - name: amount
            description: "Total amount for the given order"
            
  
#---------------------------------------------------
# dim_customers
#---------------------------------------------------
    
    - name: dim_customers
      description: "Table containing information about customers and their orders"
      columns:

        - name: customer_id
          description: "The customer identifier, primary key for this table"
          data_tests:
              - unique
              - not_null

        - name: customer_name
          description: "Name of the customer"

        - name: customer_surname
          description: "Surname of the customer"

        - name: orders_total
          description: "Number of orders made by this customer"

        - name: customer_amount
          description: "Total amount spent by the customer"
          