version: 2

models:

#---------------------------------------------------
# jaffle_shop_customers
#---------------------------------------------------

    - name: stg_jaffle_shop__customers
      description: "The staging model related to customers"
      columns:

          - name: id
            description: "The customer identifier, primary key of the table"
            data_tests:
                - unique
                - not_null
            
          - name: first_name
            description: "First name of the customer"

          - name: last_name
            description: "Last name of the customer"
  
#---------------------------------------------------
# jaffle_shop_orders
#---------------------------------------------------
    
    - name: stg_jaffle_shop__orders
      description: "Staging model related to Jaffle Shop orders"
      columns:

          - name: id
            description: "The order identifier, primary key for this table"
            data_tests:
                - unique
                - not_null

          - name: user_id
            description: "ID of the customer who made this order"
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('stg_jaffle_shop__customers')
                    field: id

          - name: order_date
            description: "Date of the order"

          - name: order_status
            description: "Satus of the order"
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['returned', 'completed', 'return_pending', 'shipped', 'placed']     

#---------------------------------------------------
# stripe_payments
#---------------------------------------------------

    - name: stg_stripe_payments
      description: "A staging layer model containing info about stripe payments for Jaffle Shop"
      columns:
          - name: id
            description: "The payment identifier, primary key for this table"
            data_tests:
                - unique
                - not_null
          - name: order_id
            description: "ID of the order related to the payment."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('stg_jaffle_shop__orders')
                    field: id
          - name: payment_method
            description: "Payment method for the given order"
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']
          - name: payment_status
            description: "Payment status"
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['success', 'fail']
          - name: order_amount
            description: "Order amount"
          - name: order_created_date
            description: "Order creation date"
            data_tests:
              - not_null
    